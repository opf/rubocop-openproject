OpenProject/AddPreviewForViewComponent:
  Description: 'Add a preview for the ViewComponent.'
  Enabled: true
  VersionAdded: '0.1.0'

OpenProject/NoDoEndBlockWithRSpecCapybaraMatcherInExpect:
  Description: 'Use `{ .. }` syntax with Capybara rspec matchers instead of `do .. end`.'
  Enabled: true
  VersionAdded: '0.1.0'

OpenProject/NoNotImplementedError:
  Description: 'Do not raise `NotImplementedError` to signal an unimplemented abstract method.'
  Enabled: true
  VersionAdded: '0.4.0'

OpenProject/NoParamsInWorkPackageWhereId:
  Description: 'Avoid `WorkPackage.where(id: params[...])`; use `where_display_id_in` to honour semantic identifiers.'
  Enabled: true
  VersionAdded: '0.5.0'

OpenProject/NoSleepInFeatureSpecs:
  Description: 'Avoid using `sleep` greater than 1 second in feature specs.'
  Enabled: true
  VersionAdded: '0.1.0'

OpenProject/TestSelectorSystemArgument:
  Description: 'Pass `test_selector:` as a system argument instead of a `data-test-selector` data attribute.'
  Enabled: true
  VersionAdded: '0.8.0'
  ComponentNamespaces:
    - Primer
    - OpPrimer
  AdditionalComponents: []
  ForwardingHelpers: []
  IgnoredNestedArguments:
    - form_arguments
    - filter_input_arguments
  IgnoredSlots:
    - with_confirmation_check_box
    - with_filter_input
    - with_input
    - with_text_input
  IgnoredComponents:
    - Primer::Alpha::CheckBox
    - Primer::Alpha::CheckBoxGroup
    - Primer::Alpha::FormButton
    - Primer::Alpha::FormControl
    - Primer::Alpha::MultiInput
    - Primer::Alpha::RadioButton
    - Primer::Alpha::RadioButtonGroup
    - Primer::Alpha::Select
    - Primer::Alpha::SubmitButton
    - Primer::Alpha::TextArea
    - Primer::Alpha::TextField
    - Primer::Beta::AutoComplete

OpenProject/UseEffectiveTypeForConfiguration:
  Description: 'Read a type''s configuration through `effective_type`, not `type`, so the project''s variant is honoured.'
  Enabled: true
  VersionAdded: '0.7.0'

OpenProject/UseRenderModeInsteadOfPrimitives:
  Description: 'Use `render_mode:` instead of `static_html:`/`plain_text:`/`only_path:` on `format_text`.'
  Enabled: true
  VersionAdded: '0.6.0'

OpenProject/UseServiceResultFactoryMethods:
  Description: 'Use ServiceResult factory methods instead of ServiceResult.new.'
  Enabled: true
  VersionAdded: '0.1.0'
